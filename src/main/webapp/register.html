<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

 <form action="Register" method="post">



        <div class="head">
            <h1>Register</h1>
        </div>

        <div class="form">

            <div class="name">Name: <input type="text" placeholder="Enter name" name="name" required /></div>
            <div class="name">Email: <input type="email" placeholder="Enter email" name="email" required /></div>
            <div class="name">Password: <input type="password" placeholder="Enter password" name="password" required /></div>
            <div class="name">Confirm: <input type="password" placeholder="Confirm password" name="confirm" required /></div>
            <div class="name">Mobile No: <input type="tel" maxlength="10" placeholder="+91" name="tel" required /></div>

        </div>

        <div class="submit">
            <button type="submit">Register</button>
        </div>

    </form>



</body>
</html>
